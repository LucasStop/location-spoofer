name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: App (lint e build)
        working-directory: app
        run: |
          yarn install
          yarn lint
          yarn build
      - name: Server (sintaxe)
        working-directory: server
        run: node --check index.js
